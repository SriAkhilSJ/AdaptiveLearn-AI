<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AdaptiveLearn AI — AI-powered personalized learning for students with disabilities and special educational needs."
    />
    <title>AdaptiveLearn AI — Learn in the way that works for you</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong theme.
      // Priority: saved choice from the theme toggle > OS preference.
      (function () {
        try {
          var saved = localStorage.getItem('adaptivelearn-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
